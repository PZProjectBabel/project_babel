name: CI

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths-ignore:
      - 'final_outputs/**'
      - 'data/translations/**'
      - 'docs/progress/**'
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') && !startsWith(github.head_ref, 'update-translation') }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build src/TranslationPipeline.slnx

      - name: Test
        run: dotnet test src/TranslationPipeline.slnx --verbosity normal --no-build
