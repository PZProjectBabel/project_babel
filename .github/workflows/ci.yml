name: CI

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths-ignore:
      - 'final_outputs/**'
      - 'data/translations/**'
      - 'docs/progress/**'
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]') }}
    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Build pipeline
        run: dotnet build src/TranslationPipeline.slnx

      - name: Build WorkshopMonitor
        run: dotnet build src/WorkshopMonitor/WorkshopMonitor.csproj

      - name: Build DocGenerator
        run: dotnet build src/DocGenerator/DocGenerator.csproj

      - name: Test
        run: dotnet test src/TranslationPipeline.slnx --verbosity normal --no-build
